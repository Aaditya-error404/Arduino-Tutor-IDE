<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="16" y1="8" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#06b6d4"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Circuit Trace Nodes -->
  <circle cx="16" cy="18" r="2.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="48" cy="18" r="2.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="16" cy="46" r="2.5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="48" cy="46" r="2.5" fill="#f59e0b" opacity="0.8"/>
  
  <path d="M16 18h8M40 18h8M16 46h8M40 46h8" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Glowing Spark Lightning Bolt -->
  <path d="M35 10L19 33h13l-5 21 18-24H32l6-20z" 
        fill="url(#sparkGrad)" 
        filter="url(#glow)"/>
</svg>
